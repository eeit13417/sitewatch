services:
  postgres:
    image: postgres:16-alpine
    container_name: sitewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitewatch}
      POSTGRES_DB: ${POSTGRES_DB:-sitewatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitewatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: sitewatch-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-sitewatch}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-sitewatch}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sitewatch-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: sitewatch-api
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-sitewatch}:${POSTGRES_PASSWORD:-sitewatch}@postgres:5432/${POSTGRES_DB:-sitewatch}
      MONGO_URL: mongodb://${MONGO_USER:-sitewatch}:${MONGO_PASSWORD:-sitewatch}@mongodb:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-sitewatch}
      API_PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  ingestion:
    build:
      context: ..
      dockerfile: ingestion/Dockerfile
    container_name: sitewatch-ingestion
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-sitewatch}:${POSTGRES_PASSWORD:-sitewatch}@postgres:5432/${POSTGRES_DB:-sitewatch}
      MONGO_URL: mongodb://${MONGO_USER:-sitewatch}:${MONGO_PASSWORD:-sitewatch}@mongodb:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-sitewatch}
      MQTT_BROKER_URL: tcp://mosquitto:1883
      INGESTION_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: sitewatch-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - ingestion

  grafana:
    image: grafana/grafana:12.3.0
    container_name: sitewatch-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
  prometheus_data:
  grafana_data:
