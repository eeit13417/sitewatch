# api/ingestion are compose services as of Phase 5 (see
# docs/deployment-hardening-design.md), so Prometheus reaches them by
# service name on the shared compose network — same as postgres/mongodb.
# (Phase 4 had them running as bare host processes and needed a
# WSL2-specific workaround here; that's gone now.)
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: sitewatch-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: sitewatch-ingestion
    static_configs:
      - targets: ["ingestion:8081"]
