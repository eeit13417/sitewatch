name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestion, shared]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: gofmt check
        working-directory: ${{ matrix.service }}
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      # Covers go vet plus staticcheck/errcheck/unused/gosec — gosec is the
      # automated backstop for the project's security rule (see CLAUDE.md).
      # --build-tags=integration so the testcontainers-based test files get
      # linted too, not just the non-tagged source.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.service }}
          args: --build-tags=integration

      - name: go build
        working-directory: ${{ matrix.service }}
        run: go build ./...

      - name: go test
        working-directory: ${{ matrix.service }}
        run: go test ./... -v

  integration-test:
    name: integration-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestion]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum

      # testcontainers-go drives the Docker daemon already available on
      # GitHub-hosted runners directly — no `services:` block needed, it
      # starts and tears down its own Postgres/Mongo containers per test
      # (see api/integration_test.go, ingestion/integration_test.go).
      - name: go test (testcontainers)
        working-directory: ${{ matrix.service }}
        run: go test -tags=integration ./... -v -timeout 5m

  simulator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: simulator
        run: npm ci

      - name: run tests
        working-directory: simulator
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            api/go.sum
            ingestion/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Real infra, real ingestion, real api — same stack a developer runs
      # locally (see README's Quick start), not a mocked backend. Ports
      # accepting connections is treated as "ready"; for a fresh
      # docker-compose init that's close enough in practice, same as the
      # health-wait pattern already used for Postgres in db-schema.
      - name: start infra
        run: |
          cp .env.example .env
          cd infra
          docker compose --env-file ../.env up -d
          timeout 60 bash -c 'until (echo > /dev/tcp/localhost/5432) 2>/dev/null; do sleep 1; done'
          timeout 60 bash -c 'until (echo > /dev/tcp/localhost/27017) 2>/dev/null; do sleep 1; done'
          timeout 60 bash -c 'until (echo > /dev/tcp/localhost/1883) 2>/dev/null; do sleep 1; done'

      # Separate from the health-wait below on purpose: a cold module
      # download (no build cache yet on a fresh runner) can easily take
      # longer than a health check's timeout budget should be, and a
      # failure here (compile error, missing dependency) says so directly
      # instead of surfacing as an opaque "healthz never came up".
      - name: build ingestion + api
        run: |
          (cd ingestion && go build -o /tmp/ingestion-bin .)
          (cd api && go build -o /tmp/api-bin .)

      - name: start ingestion + api
        run: |
          nohup /tmp/ingestion-bin > /tmp/ingestion.log 2>&1 &
          nohup /tmp/api-bin > /tmp/api.log 2>&1 &
          timeout 60 bash -c 'until curl -sf localhost:8080/healthz >/dev/null; do sleep 1; done'

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: start frontend dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --host > /tmp/frontend.log 2>&1 &
          timeout 30 bash -c 'until curl -sf localhost:5173 >/dev/null; do sleep 1; done'

      - name: E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: service logs on failure
        if: failure()
        run: |
          echo "--- ingestion ---"; cat /tmp/ingestion.log || true
          echo "--- api ---"; cat /tmp/api.log || true
          echo "--- frontend ---"; cat /tmp/frontend.log || true

  # Publishes images, doesn't deploy them anywhere (see
  # docs/deployment-hardening-design.md for why that's a deliberate line —
  # continuous delivery, not continuous deployment). Only runs on main,
  # after everything that would catch a real problem has already passed —
  # a PR's code isn't main yet, nothing to publish.
  docker-build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-build, integration-test]
    name: docker-build-push-${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, ingestion]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/sitewatch-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  db-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitewatch
          POSTGRES_PASSWORD: sitewatch
          POSTGRES_DB: sitewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: apply schema
        run: PGPASSWORD=sitewatch psql -h localhost -U sitewatch -d sitewatch -f infra/postgres/init.sql

      - name: verify schema
        env:
          PGHOST: localhost
          PGUSER: sitewatch
          PGPASSWORD: sitewatch
          PGDATABASE: sitewatch
        run: |
          chmod +x scripts/verify-db.sh
          ./scripts/verify-db.sh
