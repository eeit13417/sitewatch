name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestion]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: go vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: gofmt check
        working-directory: ${{ matrix.service }}
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build
        working-directory: ${{ matrix.service }}
        run: go build ./...

      - name: go test
        working-directory: ${{ matrix.service }}
        run: go test ./... -v

  simulator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: simulator
        run: npm ci

      - name: run tests
        working-directory: simulator
        run: npm test

  db-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitewatch
          POSTGRES_PASSWORD: sitewatch
          POSTGRES_DB: sitewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: apply schema
        run: PGPASSWORD=sitewatch psql -h localhost -U sitewatch -d sitewatch -f infra/postgres/init.sql

      - name: verify schema
        env:
          PGHOST: localhost
          PGUSER: sitewatch
          PGPASSWORD: sitewatch
          PGDATABASE: sitewatch
        run: |
          chmod +x scripts/verify-db.sh
          ./scripts/verify-db.sh
